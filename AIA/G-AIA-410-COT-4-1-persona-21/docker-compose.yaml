services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=7c2cb1b898f1aa1651ad6ea74a67d30376c25679888daf7fb0c7b5a5ca15f0f9
      - POSTGRES_DB=n8n
      - POSTGRES_NON_ROOT_USER=n8n_user
      - POSTGRES_NON_ROOT_PASSWORD=b17556367c40ea0e9f901fe7eadab092b0ee8c480ac7294167f5740c4b8528ba
    volumes:
      - db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U n8n -d n8n']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n_user
      - DB_POSTGRESDB_PASSWORD=b17556367c40ea0e9f901fe7eadab092b0ee8c480ac7294167f5740c4b8528ba
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=d8d2e9363a02e12a0c6ebbe28b31a095206d68ef477467d1d4a650d995bc3c73
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_ENCRYPTION_KEY=355aba4f69da18b850af9f39c7054dcb7853e6cf1223532e8175f25229116d93
      - N8N_USER_MANAGEMENT_JWT_SECRET=29eadcbd56a560f5d347a056aa25d17351b94fcc71a64977df59d7b02f2a21b9
      - GENERIC_TIMEZONE=Africa/Porto-Novo
      - MISTRAL_API_KEY=J2pY3283BFEsQlYLvQPJQDUynbLELzUF
    ports:
      - 5678:5678
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./data:/data
      - ./templates:/templates
      - ./workflows:/workflows
    depends_on:
      postgres:
        condition: service_healthy

  n8n-runner:
    image: n8nio/runners:stable
    restart: always
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=d8d2e9363a02e12a0c6ebbe28b31a095206d68ef477467d1d4a650d995bc3c73
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    depends_on:
      - n8n

volumes:
  db_storage:
  n8n_storage:
