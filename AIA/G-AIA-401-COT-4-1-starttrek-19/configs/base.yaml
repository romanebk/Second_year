env:
  name: "LunarLander-v3"
  continuous: false
  enable_wind: false
  wind_power: 15.0
  turbulence_power: 1.5
  render_mode: "rgb_array"

seed: 0

training:
  n_episodes: 1000
  max_steps_per_episode: 1000
  lr: 0.001
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995
  batch_size: 64
  buffer_capacity: 50000
  gamma: 0.99
  target_update_freq: 100

paths:
  results: "results/"
  models: "models/"
  videos: "videos/"

logging:
  log_every: 10
  save_video_every: 50