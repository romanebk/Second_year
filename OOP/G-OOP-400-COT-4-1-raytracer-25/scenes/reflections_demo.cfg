# Démonstration des réflexions
camera:
{
    resolution = { width = 1200; height = 800; };
    position = { x = 0; y = -120; z = 40; };
    rotation = { x = 5; y = 0; z = 0; };
    fieldOfView = 65.0;
};

primitives:
{
    spheres = (
        # Sphère miroir (forte réflectivité)
        {
            x = -60; y = 0; z = 0; r = 20;
            color = { r = 200; g = 220; b = 255; };
            reflectivity = 0.8;
            shininess = 64;
        },
        # Sphère semi-réfléchissante
        {
            x = 0; y = 0; z = 0; r = 20;
            color = { r = 255; g = 100; b = 100; };
            reflectivity = 0.5;
            shininess = 32;
        },
        # Sphère matte (pas de réflexion)
        {
            x = 60; y = 0; z = 0; r = 20;
            color = { r = 100; g = 200; b = 100; };
            reflectivity = 0.0;
            shininess = 8;
        },
        # Petites sphères colorées pour se refléter
        {
            x = -30; y = 40; z = 0; r = 8;
            color = { r = 255; g = 255; b = 0; };
            reflectivity = 0.1;
            shininess = 16;
        },
        {
            x = 30; y = 45; z = 0; r = 8;
            color = { r = 0; g = 255; b = 255; };
            reflectivity = 0.1;
            shininess = 16;
        },
        {
            x = 0; y = 50; z = 5; r = 8;
            color = { r = 255; g = 0; b = 255; };
            reflectivity = 0.1;
            shininess = 16;
        }
    );

    cylinders = (
        {
            x = -90; y = 20; z = 0;
            radius = 6; height = 30;
            color = { r = 200; g = 180; b = 150; };
            reflectivity = 0.3;
            shininess = 48;
        },
        {
            x = 90; y = 20; z = 0;
            radius = 6; height = 30;
            color = { r = 150; g = 180; b = 200; };
            reflectivity = 0.3;
            shininess = 48;
        }
    );

    planes = (
        {
            axis = "Z"; position = -25;
            color = { r = 60; g = 60; b = 70; };
            reflectivity = 0.15;
            shininess = 32;
        },
        {
            axis = "Y"; position = 70;
            color = { r = 100; g = 50; b = 80; };
            reflectivity = 0.1;
            shininess = 16;
        }
    );
};

lights:
{
    ambient = 0.25;
    diffuse = 0.75;
    directional = (
        { x = -1; y = -1; z = -2; color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.6; }
    );
    point = (
        { x = 0; y = -60; z = 150; },
        { x = -120; y = -40; z = 100; },
        { x = 120; y = -40; z = 100; }
    );
};
