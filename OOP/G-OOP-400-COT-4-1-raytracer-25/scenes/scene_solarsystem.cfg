# Système solaire simplifié
camera:
{
    resolution = { width = 1920; height = 1080; };
    position = { x = 0; y = -80; z = 0; };
    rotation = { x = 0; y = 0; z = 0; };
    fieldOfView = 70.0;
};

primitives:
{
    spheres = (
        # Soleil central
        { x = 0; y = 60; z = 0; r = 30; color = { r = 255; g = 200; b = 50; }; },
        # Planètes
        { x = -60; y = 40; z = 5; r = 8; color = { r = 200; g = 100; b = 50; }; },
        { x = -90; y = 50; z = -5; r = 12; color = { r = 100; g = 150; b = 255; }; },
        { x = 70; y = 30; z = 8; r = 10; color = { r = 200; g = 50; b = 50; }; },
        { x = 110; y = 60; z = -3; r = 20; color = { r = 200; g = 150; b = 100; }; },
        { x = -40; y = 80; z = 10; r = 6; color = { r = 150; g = 200; b = 150; }; },
        { x = 40; y = 80; z = -8; r = 7; color = { r = 100; g = 100; b = 200; }; },
        # Lunes
        { x = -95; y = 42; z = 5; r = 3; color = { r = 200; g = 200; b = 200; }; },
        { x = 118; y = 55; z = 5; r = 4; color = { r = 180; g = 160; b = 140; }; },
        { x = 103; y = 65; z = -8; r = 3; color = { r = 180; g = 160; b = 140; }; }
    );
    planes = (
        { axis = "Z"; position = -40; color = { r = 5; g = 5; b = 20; }; }
    );
    cylinders = ();
    cones = ();
};

lights:
{
    ambient = 0.1;
    diffuse = 0.9;
    point = (
        { x = 0; y = 60; z = 0; },
        { x = 0; y = 60; z = 50; }
    );
    directional = (
        { x = -1; y = -1; z = -1; }
    );
};