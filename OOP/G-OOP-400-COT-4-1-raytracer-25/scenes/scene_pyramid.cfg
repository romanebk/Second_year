# Pyramide de cônes et sphères
camera:
{
    resolution = { width = 1920; height = 1080; };
    position = { x = 0; y = -80; z = 0; };
    rotation = { x = 0; y = 0; z = 0; };
    fieldOfView = 65.0;
};

primitives:
{
    spheres = (
        # Rangée basse
        { x = -90; y = 30; z = -15; r = 12; color = { r = 255; g = 80; b = 80; }; },
        { x = -60; y = 30; z = -15; r = 12; color = { r = 255; g = 150; b = 80; }; },
        { x = -30; y = 30; z = -15; r = 12; color = { r = 255; g = 255; b = 80; }; },
        { x =   0; y = 30; z = -15; r = 12; color = { r = 80; g = 255; b = 80; }; },
        { x =  30; y = 30; z = -15; r = 12; color = { r = 80; g = 200; b = 255; }; },
        { x =  60; y = 30; z = -15; r = 12; color = { r = 80; g = 80; b = 255; }; },
        { x =  90; y = 30; z = -15; r = 12; color = { r = 200; g = 80; b = 255; }; },
        # Rangée milieu
        { x = -60; y = 40; z = 10; r = 12; color = { r = 255; g = 100; b = 150; }; },
        { x = -20; y = 40; z = 10; r = 12; color = { r = 100; g = 255; b = 200; }; },
        { x =  20; y = 40; z = 10; r = 12; color = { r = 255; g = 200; b = 100; }; },
        { x =  60; y = 40; z = 10; r = 12; color = { r = 150; g = 100; b = 255; }; },
        # Rangée haute
        { x = -30; y = 50; z = 30; r = 12; color = { r = 255; g = 150; b = 255; }; },
        { x =  30; y = 50; z = 30; r = 12; color = { r = 150; g = 255; b = 255; }; },
        # Sommet
        { x = 0; y = 55; z = 50; r = 15; color = { r = 255; g = 255; b = 255; }; }
    );
    planes = (
        { axis = "Z"; position = -25; color = { r = 40; g = 40; b = 60; }; },
        { axis = "Y"; position = 120; color = { r = 20; g = 20; b = 40; }; }
    );
    cylinders = (
        { x = -90; y = 30; z = 0; radius = 5; height = 15; color = { r = 100; g = 100; b = 100; }; },
        { x =  90; y = 30; z = 0; radius = 5; height = 15; color = { r = 100; g = 100; b = 100; }; }
    );
    cones = (
        { x = -90; y = 30; z = 15; radius = 8; height = 15; color = { r = 200; g = 200; b = 200; }; },
        { x =  90; y = 30; z = 15; radius = 8; height = 15; color = { r = 200; g = 200; b = 200; }; }
    );
};

lights:
{
    ambient = 0.2;
    diffuse = 0.8;
    point = (
        { x = 0;    y = -20; z = 150; },
        { x = -200; y = 0;   z = 100; },
        { x =  200; y = 0;   z = 100; }
    );
    directional = (
        { x = -1; y = -1; z = -1; },
        { x =  1; y = -1; z = -1; }
    );
};