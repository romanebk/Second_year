# Cité futuriste vue de face
camera:
{
    resolution = { width = 1920; height = 1080; };
    position = { x = 0; y = -80; z = 0; };
    rotation = { x = 0; y = 0; z = 0; };
    fieldOfView = 72.0;
};

primitives:
{
    spheres = (
        # Dômes des bâtiments
        { x = 0;    y = 40; z = 55; r = 18; color = { r = 200; g = 220; b = 255; }; },
        { x = -70;  y = 30; z = 35; r = 12; color = { r = 255; g = 180; b = 100; }; },
        { x =  70;  y = 30; z = 35; r = 12; color = { r = 100; g = 180; b = 255; }; },
        { x = -130; y = 25; z = 20; r = 10; color = { r = 255; g = 100; b = 100; }; },
        { x =  130; y = 25; z = 20; r = 10; color = { r = 100; g = 255; b = 150; }; },
        # Petites lumières décoratives
        { x = -35; y = 20; z = 5; r = 4; color = { r = 255; g = 255; b = 100; }; },
        { x =  35; y = 20; z = 5; r = 4; color = { r = 255; g = 255; b = 100; }; },
        { x = -105; y = 15; z = 5; r = 3; color = { r = 100; g = 200; b = 255; }; },
        { x =  105; y = 15; z = 5; r = 3; color = { r = 100; g = 200; b = 255; }; },
        # Soleil/lune
        { x = 100; y = 80; z = 30; r = 20; color = { r = 255; g = 240; b = 200; }; }
    );

    cylinders = (
        # Tour centrale
        { x = 0;    y = 40; z = 0;  radius = 15; height = 55; color = { r = 150; g = 160; b = 180; }; },
        # Tours secondaires
        { x = -70;  y = 30; z = 0;  radius = 10; height = 35; color = { r = 160; g = 140; b = 120; }; },
        { x =  70;  y = 30; z = 0;  radius = 10; height = 35; color = { r = 120; g = 140; b = 160; }; },
        # Tours arrière
        { x = -130; y = 25; z = 0;  radius = 8;  height = 20; color = { r = 140; g = 120; b = 120; }; },
        { x =  130; y = 25; z = 0;  radius = 8;  height = 20; color = { r = 120; g = 140; b = 120; }; },
        # Petites colonnes
        { x = -35;  y = 20; z = 0;  radius = 4;  height = 5;  color = { r = 180; g = 180; b = 180; }; },
        { x =  35;  y = 20; z = 0;  radius = 4;  height = 5;  color = { r = 180; g = 180; b = 180; }; },
        { x = -105; y = 15; z = 0;  radius = 3;  height = 3;  color = { r = 160; g = 160; b = 160; }; },
        { x =  105; y = 15; z = 0;  radius = 3;  height = 3;  color = { r = 160; g = 160; b = 160; }; }
    );

    cones = (
        # Toits des tours
        { x = 0;    y = 40; z = 55; radius = 20; height = 25; color = { r = 255; g = 200; b = 50;  }; },
        { x = -70;  y = 30; z = 35; radius = 15; height = 20; color = { r = 255; g = 150; b = 50;  }; },
        { x =  70;  y = 30; z = 35; radius = 15; height = 20; color = { r = 50;  g = 150; b = 255; }; },
        { x = -130; y = 25; z = 20; radius = 12; height = 15; color = { r = 255; g = 80;  b = 80;  }; },
        { x =  130; y = 25; z = 20; radius = 12; height = 15; color = { r = 80;  g = 255; b = 120; }; }
    );

    planes = (
        { axis = "Z"; position = -5;  color = { r = 60; g = 65; b = 80; }; },
        { axis = "Y"; position = 150; color = { r = 20; g = 25; b = 50; }; }
    );
};

lights:
{
    ambient = 0.2;
    diffuse = 0.8;
    point = (
        { x = 0;    y = -30; z = 200; },
        { x = -200; y = 0;   z = 150; },
        { x =  200; y = 0;   z = 150; },
        { x = 100;  y = 80;  z = 80;  }
    );
    directional = (
        { x = -1; y = -1; z = -1; }
    );
};