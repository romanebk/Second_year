# Démonstration de la rotation des primitives
camera:
{
    resolution = { width = 1200; height = 800; };
    position = { x = 0; y = -120; z = 60; };
    rotation = { x = 10; y = 0; z = 0; };
    fieldOfView = 65.0;
};

primitives:
{
    # Cylindres inclinés
    cylinders = (
        {
            x = -80; y = 0; z = 0;
            radius = 10; height = 50;
            color = { r = 255; g = 100; b = 100; };
            translation = { x = 0; y = 0; z = 0; };
            rotation = { x = 0; y = 0; z = 45; };
        },
        {
            x = -40; y = 0; z = 0;
            radius = 10; height = 50;
            color = { r = 100; g = 255; b = 100; };
            rotation = { x = 30; y = 0; z = 0; };
        },
        {
            x = 0; y = 0; z = 0;
            radius = 10; height = 50;
            color = { r = 100; g = 100; b = 255; };
            rotation = { x = 0; y = 30; z = 0; };
        },
        {
            x = 40; y = 0; z = 0;
            radius = 10; height = 50;
            color = { r = 255; g = 255; b = 100; };
            rotation = { x = 45; y = 45; z = 0; };
        },
        {
            x = 80; y = 0; z = 0;
            radius = 10; height = 50;
            color = { r = 255; g = 100; b = 255; };
            rotation = { x = 20; y = 30; z = 40; };
        }
    );

    # Cônes inclinés
    cones = (
        {
            x = -60; y = 30; z = 0;
            radius = 15; height = 30;
            color = { r = 100; g = 200; b = 255; };
            rotation = { x = 0; y = 0; z = -30; };
        },
        {
            x = 60; y = 30; z = 0;
            radius = 15; height = 30;
            color = { r = 255; g = 200; b = 100; };
            rotation = { x = -20; y = 20; z = 20; };
        }
    );

    # Plan incliné au fond
    planes = (
        {
            axis = "Z"; position = -30;
            color = { r = 80; g = 80; b = 90; };
        },
        {
            axis = "Y"; position = 60;
            color = { r = 120; g = 60; b = 40; };
            rotation = { x = 0; y = 0; z = 15; };
        }
    );

    # Sphère de référence
    spheres = (
        {
            x = 0; y = -10; z = 0; r = 8;
            color = { r = 255; g = 255; b = 255; };
        }
    );
};

lights:
{
    ambient = 0.3;
    diffuse = 0.7;
    directional = (
        { x = -1; y = -1; z = -1; color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.8; }
    );
    point = (
        { x = 0; y = -50; z = 120; },
        { x = -150; y = -50; z = 80; },
        { x = 150; y = -50; z = 80; }
    );
