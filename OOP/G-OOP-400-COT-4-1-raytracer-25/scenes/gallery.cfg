# Galerie complète : rotation, réflexions, spéculaire, anti-aliasing
camera:
{
    resolution = { width = 1920; height = 1080; };
    position = { x = 0; y = -180; z = 60; };
    rotation = { x = 8; y = 0; z = 0; };
    fieldOfView = 65.0;
};

primitives:
{
    spheres = (
        # Sphère miroir centrale (reflète tout l'environnement)
        {
            x = 0; y = 0; z = 0; r = 28;
            color = { r = 220; g = 230; b = 255; };
            reflectivity = 0.85;
            shininess = 128;
        },
        # Sphères colorées brillantes
        {
            x = -90; y = 15; z = 0; r = 15;
            color = { r = 255; g = 60; b = 60; };
            reflectivity = 0.4;
            shininess = 64;
        },
        {
            x = -55; y = 30; z = 0; r = 12;
            color = { r = 60; g = 255; b = 60; };
            reflectivity = 0.3;
            shininess = 48;
        },
        {
            x = 55; y = 30; z = 0; r = 12;
            color = { r = 60; g = 60; b = 255; };
            reflectivity = 0.3;
            shininess = 48;
        },
        {
            x = 90; y = 15; z = 0; r = 15;
            color = { r = 255; g = 255; b = 60; };
            reflectivity = 0.4;
            shininess = 64;
        },
        # Petites sphères réfléchissantes au-dessus
        {
            x = -30; y = 60; z = 10; r = 7;
            color = { r = 255; g = 150; b = 50; };
            reflectivity = 0.2;
            shininess = 32;
        },
        {
            x = 0; y = 68; z = 8; r = 7;
            color = { r = 50; g = 150; b = 255; };
            reflectivity = 0.2;
            shininess = 32;
        },
        {
            x = 30; y = 60; z = 10; r = 7;
            color = { r = 255; g = 50; b = 150; };
            reflectivity = 0.2;
            shininess = 32;
        }
    );

    cylinders = (
        # Piliers inclinés (rotation)
        {
            x = -140; y = 15; z = 0;
            radius = 8; height = 70;
            color = { r = 160; g = 140; b = 120; };
            rotation = { x = 0; y = 0; z = 15; };
            reflectivity = 0.2;
            shininess = 32;
        },
        {
            x = 140; y = 15; z = 0;
            radius = 8; height = 70;
            color = { r = 120; g = 140; b = 160; };
            rotation = { x = 0; y = 0; z = -15; };
            reflectivity = 0.2;
            shininess = 32;
        },
        # Petit cylindre brillant
        {
            x = 0; y = 0; z = 0;
            radius = 4; height = 20;
            color = { r = 255; g = 215; b = 0; };
            reflectivity = 0.5;
            shininess = 96;
        }
    );

    cones = (
        # Cônes inclinés de chaque côté
        {
            x = -120; y = -10; z = 0;
            radius = 22; height = 35;
            color = { r = 80; g = 160; b = 80; };
            rotation = { x = 0; y = 0; z = -25; };
            reflectivity = 0.15;
            shininess = 24;
        },
        {
            x = 120; y = -10; z = 0;
            radius = 22; height = 35;
            color = { r = 160; g = 80; b = 80; };
            rotation = { x = 0; y = 0; z = 25; };
            reflectivity = 0.15;
            shininess = 24;
        }
    );

    planes = (
        # Sol réfléchissant
        {
            axis = "Z"; position = -35;
            color = { r = 60; g = 60; b = 70; };
            reflectivity = 0.2;
            shininess = 32;
        },
        # Mur du fond
        {
            axis = "Y"; position = 80;
            color = { r = 90; g = 70; b = 100; };
            reflectivity = 0.1;
            shininess = 16;
        }
    );
};

lights:
{
    ambient = 0.2;
    diffuse = 0.8;
    directional = (
        { x = -2; y = -1; z = -3; color = { r = 1.0; g = 1.0; b = 0.9; }; intensity = 0.6; }
    );
    point = (
        { x = 0; y = -60; z = 200; intensity = 1.0; },
        { x = -200; y = -50; z = 100; intensity = 0.7; },
        { x = 200; y = -50; z = 100; intensity = 0.7; }
    );
};
