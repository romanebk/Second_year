<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AANID - undef Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #F5F5DC; }
    /* Tab bar */
    #tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; background: #212121; z-index: 1000;
      border-top-left-radius: 22px; border-top-right-radius: 22px;
      padding: 6px 0; box-shadow: 0 -6px 20px rgba(0,0,0,0.35);
    }
    #tab-bar button {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2px; background: none; border: none;
      padding: 8px 0; cursor: pointer; border-radius: 10px; margin: 0 4px;
      font-size: 10px; font-weight: 500; color: #9CA3AF; letter-spacing: 0.2px;
      transition: all 0.2s;
    }
    #tab-bar button.active { color: #F5A623; font-weight: 700; background: rgba(245,166,35,0.15); }
    #tab-bar button .icon { font-size: 22px; }
    #tab-bar button .label { font-family: 'CenturyGothic', sans-serif; }
    #screen-container { height: 100%; padding-bottom: 70px; overflow-y: auto; }
    #screen-container > div { display: none; height: 100%; }
    #screen-container > div.active { display: block; }
    .watermark {
      position: fixed; top: 8px; right: 12px; font-size: 11px;
      color: #aaa; background: rgba(0,0,0,0.06); padding: 4px 10px;
      border-radius: 12px; z-index: 999; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="watermark">undef demo · port 3030</div>
  <div id="tab-bar">
    <button class="active" data-tab="posts" onclick="switchTab('posts')">
      <span class="icon">📢</span>
      <span class="label">Posts</span>
    </button>
    <button data-tab="consult" onclick="switchTab('consult')">
      <span class="icon">📊</span>
      <span class="label">Consult</span>
    </button>
  </div>
  <div id="screen-container">
    <div id="screen-posts" class="active"></div>
    <div id="screen-consult"></div>
  </div>
  <script>
    function switchTab(name) {
      document.querySelectorAll('#tab-bar button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('#screen-container > div').forEach(d => d.classList.remove('active'));
      document.querySelector(`#tab-bar button[data-tab="${name}"]`).classList.add('active');
      document.getElementById(`screen-${name}`).classList.add('active');
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
